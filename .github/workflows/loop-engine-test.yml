name: loop-engine test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: run loop-engine self-test suite
        run: bash tools/loop-engine/test/run.sh
      - name: validate plugin + marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict .
          claude plugin validate --strict tools/loop-engine

  verifier-pinned-review:
    # base가 있어야 성립하는 pinned-baseline 체크 — pull_request 이벤트에서만 의미가 있다
    # (issue #14, ADR-0002).
    if: "${{ github.event_name == 'pull_request' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: run verifier-pinned-review against the PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash tools/loop-engine/bin/verifier-pinned-review.sh --base "$BASE_SHA"
